# Scoped to one version and CVE, with an expiry. Fixed in ruby 3.4.12,
# which nixos-26.05 does not ship yet (3.4.11 as of 2026-11-09). Remove
# this entry when nixpkgs-lock moves to a 26.05 revision with 3.4.12.
["ruby-3.4.9"]
cve = ["CVE-2026-97229"]
until = "2027-02-09"
comment = "upstream nixpkgs; fixed in 3.4.12, not yet in nixos-26.05"
