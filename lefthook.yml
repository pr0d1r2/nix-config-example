pre-commit:
  parallel: true
  setup:
    - run: bash scripts/lefthook/require-dev-shell.sh
  commands:
    narrow-language-nix:
      glob: "*.nix"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-nix.dic
      run: lefthook-narrow-language $(printf '%s\n' {staged_files} | grep -E '\.nix$')
    narrow-language-python:
      glob: "*.py"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-python.dic
      run: >-
        files=$(printf '%s\n' {staged_files} | grep -E '\.py$' || true);
        if [ -n "$files" ]; then lefthook-narrow-language $files; fi
    narrow-language-markdown:
      glob: "*.md"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-markdown.dic
      run: >-
        files=$(printf '%s\n' {staged_files} | grep -E '\.md$' || true);
        if [ -n "$files" ]; then lefthook-narrow-language $files; fi
    narrow-language-nix-freeze:
      skip: true
    narrow-language-shell-freeze:
      skip: true
    narrow-language-markdown-freeze:
      skip: true
    narrow-language-other-freeze:
      skip: true
    narrow-language-other:
      exclude:
        - "*.nix"
        - "*.sh"
        - "*.bats"
        - "*.py"
        - "*.rb"
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.erb"
        - "*.hcl"
        - "*.tf"
        - "*.css"
        - "*.scss"
        - "*.md"
        - "*.dic"
        - "flake.lock"
      # The remote job compacts the dictionary against files matching
      # NARROW_LANGUAGE_GLOB_INCLUDE, but checks every file not excluded.
      # Match the extensionless dotfiles and LICENSE it would miss, or
      # compaction drops their words and the check fails.
      env:
        NARROW_LANGUAGE_GLOB_INCLUDE_EXTRA: '^(\.[a-z-]+|LICENSE)$'
    tdd-order-bats:
      env:
        LEFTHOOK_TDD_SPEC_DIR: tests/unit
        LEFTHOOK_TDD_SRC_STRIP: ""
    bats-changed:
      glob: "*.{sh,bats}"
      timeout: 60s
      exclude:
        - "build.sh"
        - "tests/unit/build.bats"
        - "tests/integration/"
      run: lefthook-bats-changed {staged_files}
    ascii-only:
      exclude:
        - "SPEC.md"
        - "flake.lock"
    nix-flake-eval:
      env:
        LEFTHOOK_NIX_FLAKE_EVAL_ATTR: ".#darwinConfigurations.macos-arm.system"
    execute-permissions:
      env:
        LEFTHOOK_EXECUTE_PERMISSIONS_ALLOWED: '^(\\./)?scripts/|^(\\./)?bin/'
    unicode-lint:
      env:
        LEFTHOOK_UNICODE_LINT_TIMEOUT: "120"

pre-push:
  parallel: false
  setup:
    - run: >-
        bash scripts/lefthook/require-dev-shell.sh
        lefthook-vulnix-scan
        lefthook-narrow-language
  commands:
    narrow-language-nix:
      glob: "*.nix"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-nix.dic
      run: >-
        files=$(printf '%s\n' {push_files} | grep -E '\.nix$' || true);
        if [ -n "$files" ]; then lefthook-narrow-language $files; fi
    narrow-language-python:
      glob: "*.py"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-python.dic
      run: >-
        files=$(printf '%s\n' {push_files} | grep -E '\.py$' || true);
        if [ -n "$files" ]; then lefthook-narrow-language $files; fi
    narrow-language-markdown:
      glob: "*.md"
      env:
        NARROW_LANGUAGE_DICT: .narrow-language-markdown.dic
      run: >-
        files=$(printf '%s\n' {push_files} | grep -E '\.md$' || true);
        if [ -n "$files" ]; then lefthook-narrow-language $files; fi
    narrow-language-other:
      exclude:
        - "*.nix"
        - "*.sh"
        - "*.bats"
        - "*.py"
        - "*.rb"
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.erb"
        - "*.hcl"
        - "*.tf"
        - "*.css"
        - "*.scss"
        - "*.md"
        - "*.dic"
        - "flake.lock"
    ascii-only:
      exclude:
        - "SPEC.md"
        - "flake.lock"
    tdd-order-bats:
      env:
        LEFTHOOK_TDD_SPEC_DIR: tests/unit
        LEFTHOOK_TDD_SRC_STRIP: ""
    bats-changed:
      env:
        LEFTHOOK_BATS_CHANGED_TIMEOUT: "300"
    execute-permissions:
      env:
        LEFTHOOK_EXECUTE_PERMISSIONS_ALLOWED: '^(\\./)?scripts/|^(\\./)?bin/'
    unicode-lint:
      env:
        LEFTHOOK_UNICODE_LINT_TIMEOUT: "120"
    linter-coverage:
      skip: true
    bats-unit:
      timeout: 180s
      run: bats --recursive --jobs $(nproc) tests/unit
    flake-nix-build:
      timeout: 300s
      run: bats tests/integration/build.bats
